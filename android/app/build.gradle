apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.gamemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.junge.kidtime"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "3.5"
    }

    /**
     * 固定签名（关键）。
     * 之前用 CI 每次临时生成的 debug.keystore → 每版签名不同 → 安卓拒绝覆盖安装，
     * 只能先卸载；而卸载又被设备管理员挡住，形成死锁。
     * 现在 debug/release 都签同一套证书，版本之间可直接覆盖升级。
     */
    signingConfigs {
        fixed {
            storeFile file("gm-release.jks")
            storePassword "gm123456"
            keyAlias "gmkey"
            keyPassword "gm123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core-ktx:1.13.1"
}
