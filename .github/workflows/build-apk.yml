name: 构建并发布 APK

# 触发：推送到 main 自动构建 APK → 发 Release → 部署到 GitHub Pages（手机扫码直接装，无需 GitHub 账号）
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.py'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK（用 runner 自带 SDK，规避 setup-android@v3 的 sdkmanager tools 报错）
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 把网页应用打包进 APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: 编译 Debug APK
        run: cd android && gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK 并计算指纹
        run: |
          mkdir -p output
          VN=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/KidTime.apk"
          # 带版本号的文件名：手机浏览器和 CDN 都按 URL 缓存，同名文件会一直下发旧包
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/KidTime-v${VN}-${VC}.apk"
          sha256sum output/KidTime.apk | awk '{print $1}' > output/apk.sha256
          echo "产出版本: v${VN} (${VC})"
          ls -la output/

      - name: 生成二维码（指向 Pages 直接下载，失败不阻断出包）
        run: |
          DOWN="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          pip install "qrcode[pil]" --quiet || true
          python -c "import qrcode; qrcode.make('$DOWN').save('output/qr.png')" || echo "qr 生成跳过（不影响 APK）"

      - name: 上传构建产物供 Pages 使用
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: output/

      - name: 发布 Release 并上传 APK + 二维码 + 指纹
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 时间约定 v1.0.${{ github.run_number }}
          body: |
            自动构建 #${{ github.run_number }}

            ## 安装（二选一）
            **A. 手机直接装（推荐，无需 GitHub 账号）**
            打开或扫描二维码指向的地址（已部署到 GitHub Pages 直接下载），下载后安装。

            **B. 本 Release 下载（需登录 GitHub）**
            点附件 KidTime.apk，开启「设置 → 安全 → 允许未知来源」后安装。

            SHA256 见附件 KidTime.apk.sha256。
          files: |
            output/KidTime.apk
            output/KidTime-v*.apk
            output/qr.png
            output/apk.sha256
          prerelease: false

  # 把 APK 部署到 GitHub Pages：手机扫码免登录直接下载
  # 需在仓库 Settings → Pages → Source 选择 "GitHub Actions"（一次性）。未开启也不影响上面的 Release 出包。
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: output/

      - name: 解析版本号与文件名
        run: |
          # GITHUB_ENV 只在单个 job 内有效，pages 是独立 job，必须从产物文件名反解
          f=$(ls output/KidTime-v*.apk 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            base=$(basename "$f")
            VN=$(echo "$base" | sed -E 's/^KidTime-v(.*)-[0-9]+\.apk$/\1/')
            VC=$(echo "$base" | sed -E 's/^KidTime-v(.*)-([0-9]+)\.apk$/\2/')
          else
            base="KidTime.apk"; VN="?"; VC="?"
          fi
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "APKF=$base" >> "$GITHUB_ENV"
          echo "解析到: $base -> v$VN ($VC)"

      - name: 生成下载落地页
        run: |
          sha="$(cat output/apk.sha256 2>/dev/null || echo '')"
          APK="$APKF"
          cat > output/index.html <<HTML
          <!doctype html><html lang="zh"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
          <title>下载 时间约定 v${VN}</title>
          <style>body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei";background:#f3f5f9;color:#111827;display:flex;min-height:100vh;margin:0}
          main{margin:auto;text-align:center;padding:28px}a{display:block;width:100%;max-width:360px;margin:16px auto;padding:16px;background:#2563eb;color:#fff;border-radius:14px;text-decoration:none;font-size:17px;font-weight:700}
          code{background:#eef2f7;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
          .ver{display:inline-block;background:#dcfce7;color:#166534;font-weight:800;font-size:14px;padding:6px 14px;border-radius:20px;margin:4px 0 10px}
          .tip{font-size:12.5px;color:#64748b;max-width:360px;margin:14px auto 0;line-height:1.6}</style></head>
          <body><main>
            <h1>时间约定</h1>
            <div class="ver">当前版本 v${VN} (${VC})</div>
            <p>安装：设置 → 安全 → 允许未知来源 → 打开 APK。</p>
            <div><img src="qr.png" width="200" height="200" alt="二维码" onerror="this.style.display='none'"></div>
            <a href="${APK}">下载 ${APK}</a>
            <p>SHA256：<code>${sha}</code></p>
            <div class="tip">装完到「我的 → 崩溃日志」最下面一行核对版本号，不是 v${VN} 就说明还在用旧包。<br>
            文件名带版本号，所以下载到的必然是这个版本，不会被浏览器缓存成旧的。</div>
          </main></body></html>
          HTML

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
